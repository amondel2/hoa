info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
                - text/html
                - application/xhtml+xml
            js: text/javascript
            json:
                - application/json
                - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
                - application/hal+json
                - application/hal+xml
            xml:
                - text/xml
                - application/xml
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none
        default:
            codec: html
    codegen:
        defaultPackage: com.gcl
    profile: web
    plugin:
        databasemigration:
            updateOnStart: true
            updateOnStartFileName: changelog.groovy
management:
    endpoints:
        enabled-by-default: false
upload:
    directory:

encyptKey: ${ENCY_KEY:5840d25c4dc3467daff45264d3e59a7e}

defaults:
    adminUser: ${ADMIN_USER:aaron}
    adminPassword: ${ADMIN_PASSWORD:test@me12345}
    adminEmail: ${ADMIN_PASSWORD:amondel2@test.com}
dataSource:
    driverClassName: org.mariadb.jdbc.Driver
    dialect: org.hibernate.dialect.MariaDBDialect
    username: ${DB_USER}
    password:  ${DB_PASSWORD}
    pooled: true
    jmxExport: true
environments:
    development:
        dataSource:
            dbCreate: none
            url: ${JDBC_CONNECTION_STRING}
    production:
        dataSource:
            dbCreate: none
            url: ${JDBC_CONNECTION_STRING}
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2
        upload:
            directory: /opt/tomcat/uploads/
    test:
        dataSource:
            username: sa
            password: ''
            dbCreate: create-drop
            driverClassName: org.h2.Driver
            url: jdbc:h2:mem:testDb;MVCC=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
javamelody:
    # Enable JavaMelody auto-configuration (optional, default: true)
    enabled: true
    # Data source names to exclude from monitoring (optional, comma-separated)
    #excluded-datasources: secretSource,topSecretSource
    # Enable monitoring of Spring services and controllers (optional, default: true)
    spring-monitoring-enabled: true
    authorized-users: user1:pwd1
    # Initialization parameters for JavaMelody (optional)
    # See: https://github.com/javamelody/javamelody/wiki/UserGuide#6-optional-parameters
    init-parameters:
        # log http requests:
        log: true

hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
